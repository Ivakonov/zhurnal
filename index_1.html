<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал репетитора — облік занять і оплат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5EF; --surface:#FFFFFF; --ink:#1C2321; --muted:#7C776C; --line:#E7E2D6;
    --pine:#0C5A50; --pine-2:#136F63; --teal:#2A9D8F;
    --brick:#BE4A34; --amber:#D98A2B; --slate:#3B6EA5;
    --pine-wash:#E9F1EE; --gold-wash:#FBF3E2; --brick-wash:#F7E9E5; --slate-wash:#E9F0F7;
    --radius:16px;
    --shadow:0 1px 2px rgba(28,35,33,.04), 0 12px 30px -18px rgba(28,35,33,.35);
    --shadow-lg:0 24px 60px -28px rgba(12,90,80,.5);
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.display{font-family:"Bricolage Grotesque","Inter",sans-serif;letter-spacing:-.02em;line-height:1.08}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
  ::selection{background:var(--amber);color:#fff}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
  .hidden{display:none!important}

  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:14px;height:64px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--pine-2),var(--pine));display:grid;place-items:center;color:#fff;font-family:"Bricolage Grotesque";font-weight:800;box-shadow:0 6px 16px -8px var(--pine);transform:rotate(-4deg)}
  .brand .name{font-family:"Bricolage Grotesque";font-size:1.2rem;font-weight:700;line-height:1}
  .brand .name small{display:block;font-family:"Inter";font-size:.64rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .top .spacer{flex:1}

  nav.tabs{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:64px;z-index:39}
  nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav.tabs .wrap::-webkit-scrollbar{display:none}
  .tab{padding:14px 15px;font-weight:600;font-size:.93rem;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:7px}
  .tab.active{color:var(--pine);border-color:var(--pine)}
  .tab:hover:not(.active){color:var(--ink)}

  main{padding:26px 0 100px}

  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:10px 16px;border-radius:11px;font-weight:600;font-size:.92rem;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--pine);color:#fff;border-color:var(--pine)}
  .btn.primary:hover{background:var(--pine-2)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:#00000008;box-shadow:none}
  .btn.small{padding:7px 12px;font-size:.84rem;border-radius:9px}
  .btn.danger{color:var(--brick)}
  .btn.danger:hover{background:#be4a340f;border-color:#be4a3455}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);transition:.12s}
  .icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .page-head h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
  .page-head p{color:var(--muted);font-size:.92rem;margin-top:3px}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pine-2)}
  .stat.amber::before{background:var(--amber)} .stat.brick::before{background:var(--brick)} .stat.slate::before{background:var(--slate)}
  .stat .lbl{font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .stat .val{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.7rem;margin-top:6px;line-height:1}
  .stat .sub{font-size:.8rem;color:var(--muted);margin-top:4px}

  .cal-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cal-title{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.25rem;min-width:180px}
  .cal-grid{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cal-head,.cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
  .cal-head div{padding:10px 6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
  .cal-head div.we{color:var(--brick)}
  .cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;gap:3px;position:relative}
  .cell:nth-child(7n){border-right:none}
  .cell:hover{background:var(--pine-wash)}
  .cell.dim{background:#00000004;color:var(--muted)}
  .cell.today .daynum{background:var(--pine);color:#fff}
  .cell.sel{background:var(--gold-wash);box-shadow:inset 0 0 0 2px var(--amber)}
  .daynum{align-self:flex-start;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.82rem;font-weight:700}
  .lchip{font-size:.7rem;font-weight:600;padding:2px 5px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .lchip.st-cancelled_free,.lchip.st-moved{opacity:.55;text-decoration:line-through}
  .cell .more{font-size:.68rem;color:var(--muted);font-weight:600}
  @media(max-width:640px){.cell{min-height:70px;padding:4px}.lchip{font-size:.62rem}.daynum{width:20px;height:20px;font-size:.72rem}}

  .day-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:16px}
  .day-panel h3{font-size:1.1rem;margin-bottom:2px}
  .day-panel .dp-sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .lesson-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
  .lesson-item .tick{width:8px;align-self:stretch;border-radius:5px;min-height:34px}
  .lesson-item .li-main{flex:1;min-width:150px}
  .lesson-item .li-name{font-weight:600}
  .lesson-item .li-meta{font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
  .tag-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .li-actions{display:flex;gap:6px;flex-wrap:wrap}
  select.status-sel{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:.82rem;font-weight:600}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px}
  .list-row{display:grid;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .stu-row{grid-template-columns:1fr auto auto auto}
  @media(max-width:640px){.stu-row{grid-template-columns:1fr auto}}
  .stu-name{font-weight:600;display:flex;align-items:center;gap:8px}
  .stu-meta{font-size:.82rem;color:var(--muted)}
  .money-pos{color:var(--pine);font-weight:700} .money-neg{color:var(--brick);font-weight:700} .money-zero{color:var(--muted);font-weight:600}
  .pay-row{grid-template-columns:1fr auto auto}
  @media(max-width:640px){.pay-row{grid-template-columns:1fr auto}.hide-sm{display:none}}

  .empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:.95rem}
  .empty .big{font-size:2rem;display:block;margin-bottom:8px;opacity:.6}

  .section-title{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.1rem;margin:24px 0 10px}
  .hint{background:var(--pine-wash);border:1px solid #cfe0da;color:var(--pine);padding:11px 14px;border-radius:11px;font-size:.85rem;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}

  .tag-edit{display:grid;grid-template-columns:32px 1fr 120px 40px;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .tag-edit input{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--paper)}
  .set-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .set-block h3{font-size:1.05rem;margin-bottom:4px}
  .set-block p.d{color:var(--muted);font-size:.86rem;margin-bottom:14px}

  .modal-bg{position:fixed;inset:0;background:rgba(28,35,33,.42);backdrop-filter:blur(3px);display:none;place-items:center;z-index:100;padding:18px;overflow-y:auto}
  .modal-bg.show{display:grid}
  .modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;padding:24px;animation:pop .18s ease;margin:auto}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:1.25rem;margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pine-2);background:#fff}
  .field-row{display:flex;gap:12px}.field-row .field{flex:1}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .modal-actions .left{margin-right:auto}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .storage-warn{background:var(--gold-wash);border:1px solid #f0dcb4;color:#8a5a12;padding:11px 15px;border-radius:12px;font-size:.85rem;margin-bottom:18px;display:none;gap:9px}
  .storage-warn.show{display:flex}

  @media (prefers-reduced-motion: reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark">Ж</div>
      <div class="name">Журнал<small>облік занять і оплат</small></div>
    </div>
    <div class="spacer"></div>
    <button class="btn small ghost" onclick="exportBackup()" title="Резервна копія">⤓ Копія</button>
    <button class="btn small ghost" onclick="document.getElementById('importFile').click()">⤒ Відновити</button>
    <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importBackup(event)">
  </div>
</header>

<nav class="tabs">
  <div class="wrap">
    <button class="tab active" data-tab="calendar" onclick="go('calendar')">📅 Календар</button>
    <button class="tab" data-tab="students" onclick="go('students')">👥 Учні</button>
    <button class="tab" data-tab="payments" onclick="go('payments')">₴ Оплати</button>
    <button class="tab" data-tab="stats" onclick="go('stats')">📊 Підрахунки</button>
    <button class="tab" data-tab="settings" onclick="go('settings')">⚙ Налаштування</button>
  </div>
</nav>

<main class="wrap">
  <div class="storage-warn" id="storageWarn">⚠️ У попередньому перегляді зміни не зберігаються. На вашому сайті на GitHub усе зберігатиметься автоматично.</div>
  <div id="screen"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= storage ======================= */
const KEY='zhurnal.data.v1';
const store={
  read(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){return null;}},
  write(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true;}catch(e){return false;}},
  ok(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
};
const uid=()=>Math.random().toString(36).slice(2,10);

/* ======================= data ======================= */
function defaultData(){
  return {
    settings:{currency:'₴'},
    tags:[
      {id:uid(),name:'Мої',color:'#136F63',rate:300},
      {id:uid(),name:'Від школи',color:'#3B6EA5',rate:0},
      {id:uid(),name:'Заміна',color:'#D98A2B',rate:250}
    ],
    students:[],
    lessons:[],
    payments:[]
  };
}
let db=store.read()||defaultData();
db.settings=db.settings||{currency:'₴'};
db.tags=db.tags||[]; db.students=db.students||[]; db.lessons=db.lessons||[]; db.payments=db.payments||[];
const save=()=>store.write(db);

/* ======================= helpers ======================= */
const CUR=()=>db.settings.currency||'₴';
function money(n){const r=Math.round(n);return r.toLocaleString('uk-UA')+' '+CUR();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}

function iso(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function todayISO(){return iso(new Date());}
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONTHS_N=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
function fmtDate(s){const d=parseISO(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function fmtDateFull(s){const d=parseISO(s);return WD[(d.getDay()+6)%7]+', '+d.getDate()+' '+MONTHS[d.getMonth()];}

const STATUS={
  planned:{label:'Заплановано',color:'var(--pine-2)'},
  done:{label:'Проведено',color:'var(--pine)'},
  cancelled_paid:{label:'Скасовано (оплата)',color:'var(--amber)'},
  cancelled_free:{label:'Скасовано',color:'var(--muted)'},
  moved:{label:'Перенесено',color:'var(--slate)'}
};
const billable=s=>s==='done'||s==='cancelled_paid';
const scheduled=s=>s==='planned'||s==='done'||s==='cancelled_paid';

function tagOf(id){return db.tags.find(t=>t.id===id)||{name:'—',color:'#999',rate:0};}
function studentOf(id){return db.students.find(s=>s.id===id);}
function rateOf(stu){if(!stu)return 0;if(stu.rate!=null&&stu.rate!=='')return Number(stu.rate);return Number(tagOf(stu.tagId).rate)||0;}
function lessonCost(l){const stu=studentOf(l.studentId);return (Number(l.dur)||0)*rateOf(stu);}

function studentCharged(id){return db.lessons.filter(l=>l.studentId===id&&billable(l.status)).reduce((a,l)=>a+lessonCost(l),0);}
function studentPaid(id){return db.payments.filter(p=>p.studentId===id).reduce((a,p)=>a+(Number(p.amount)||0),0);}
function studentBalance(id){return studentPaid(id)-studentCharged(id);}

/* ======================= navigation ======================= */
let tab='calendar';
function go(t){tab=t;document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));render();window.scrollTo(0,0);}
function render(){
  const s=document.getElementById('screen');
  if(tab==='calendar')renderCalendar(s);
  else if(tab==='students')renderStudents(s);
  else if(tab==='payments')renderPayments(s);
  else if(tab==='stats')renderStats(s);
  else if(tab==='settings')renderSettings(s);
}

window.addEventListener('DOMContentLoaded',()=>{
  if(!store.ok())document.getElementById('storageWarn').classList.add('show');
  render();
});

/* ======================= CALENDAR ======================= */
let calY,calM,selDay=todayISO();
(function(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();})();

function renderCalendar(root){
  const wk=weekTotals(selDay);
  root.innerHTML=`
    <div class="page-head">
      <div><h1>Календар занять</h1><p>Натисніть на день, щоб додати або змінити урок</p></div>
      <button class="btn primary" onclick="lessonModal(null,'${selDay}')">＋ Додати урок</button>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="lbl">Цей тиждень · год</div><div class="val">${fmtHours(wk.hours)}</div><div class="sub">${wk.count} ${plz(wk.count,'урок','уроки','уроків')}</div></div>
      <div class="stat amber"><div class="lbl">Вартість тижня</div><div class="val">${money(wk.value)}</div><div class="sub">за розкладом</div></div>
      <div class="stat slate"><div class="lbl">Тиждень</div><div class="val" style="font-size:1.05rem;padding-top:6px">${wk.label}</div></div>
    </div>
    <div class="cal-bar">
      <button class="icon-btn" onclick="calNav(-1)" aria-label="Попередній місяць">←</button>
      <div class="cal-title">${MONTHS_N[calM]} ${calY}</div>
      <button class="icon-btn" onclick="calNav(1)" aria-label="Наступний місяць">→</button>
      <button class="btn small ghost" onclick="calToday()">Сьогодні</button>
      <div style="flex:1"></div>
      <button class="btn small" onclick="exportWeekICS('${selDay}')" title="Файл для Apple/Google Календаря">📆 Тиждень → календар</button>
    </div>
    <div class="cal-grid">
      <div class="cal-head">${WD.map((d,i)=>`<div class="${i>=5?'we':''}">${d}</div>`).join('')}</div>
      <div id="calBody"></div>
    </div>
    <div id="dayPanel"></div>`;
  drawMonth();
  renderDayPanel();
}
function fmtHours(h){return (Math.round(h*100)/100).toString().replace('.',',');}
function plz(n,a,b,c){const m=Math.abs(n)%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>=2&&d<=4)return b;return c;}
function calNav(delta){calM+=delta;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}drawMonth();}
function calToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();selDay=todayISO();renderCalendar(document.getElementById('screen'));}

function drawMonth(){
  const body=document.getElementById('calBody');if(!body)return;
  const first=new Date(calY,calM,1);
  let cur=mondayOf(first);
  let html='';
  for(let w=0;w<6;w++){
    html+='<div class="cal-week">';
    for(let i=0;i<7;i++){
      const dISO=iso(cur);
      const inMonth=cur.getMonth()===calM;
      const isToday=dISO===todayISO();
      const isSel=dISO===selDay;
      const dayL=db.lessons.filter(l=>l.date===dISO).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const chips=dayL.slice(0,3).map(l=>{const stu=studentOf(l.studentId);const c=tagOf(stu?stu.tagId:0).color;
        return `<div class="lchip st-${l.status}" style="background:${c}">${esc((l.time||'')+' '+(stu?stu.name:'—'))}</div>`;}).join('');
      const more=dayL.length>3?`<div class="more">+${dayL.length-3} ще</div>`:'';
      html+=`<div class="cell ${inMonth?'':'dim'} ${isToday?'today':''} ${isSel?'sel':''}" onclick="selectDay('${dISO}')">
        <span class="daynum">${cur.getDate()}</span>${chips}${more}</div>`;
      cur=addDays(cur,1);
    }
    html+='</div>';
  }
  body.innerHTML=html;
}
function selectDay(d){selDay=d;drawMonth();renderDayPanel();document.getElementById('dayPanel').scrollIntoView({behavior:'smooth',block:'nearest'});}

function renderDayPanel(){
  const p=document.getElementById('dayPanel');if(!p)return;
  const dayL=db.lessons.filter(l=>l.date===selDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const hrs=dayL.filter(l=>scheduled(l.status)).reduce((a,l)=>a+(Number(l.dur)||0),0);
  let items=dayL.length? dayL.map(l=>lessonItemHTML(l)).join('') :
    `<div class="empty"><span class="big">🗓</span>На цей день уроків немає.<br><br><button class="btn primary small" onclick="lessonModal(null,'${selDay}')">＋ Додати урок</button></div>`;
  p.innerHTML=`<div class="day-panel">
      <h3>${fmtDateFull(selDay)}</h3>
      <div class="dp-sub">${dayL.length? `${dayL.length} ${plz(dayL.length,'урок','уроки','уроків')} · ${fmtHours(hrs)} год` : 'Вільний день'}</div>
      ${items}
      ${dayL.length?`<button class="btn small" style="margin-top:6px" onclick="lessonModal(null,'${selDay}')">＋ Ще урок</button>`:''}
    </div>`;
}
function lessonItemHTML(l){
  const stu=studentOf(l.studentId);const tg=tagOf(stu?stu.tagId:0);const st=STATUS[l.status];
  const cost=billable(l.status)?money(lessonCost(l)):'';
  return `<div class="lesson-item">
    <div class="tick" style="background:${st.color}"></div>
    <div class="li-main">
      <div class="li-name">${esc(stu?stu.name:'Видалений учень')}</div>
      <div class="li-meta">
        <span>🕒 ${esc(l.time||'—')} · ${fmtHours(l.dur)} год</span>
        <span class="badge" style="background:${tg.color}22;color:${tg.color}"><span class="tag-dot" style="background:${tg.color}"></span>${esc(tg.name)}</span>
        <span class="badge" style="background:${st.color}22;color:${st.color}">${st.label}</span>
        ${cost?`<span style="font-weight:600">${cost}</span>`:''}
        ${l.note?`<span>📝 ${esc(l.note)}</span>`:''}
      </div>
    </div>
    <div class="li-actions">
      <select class="status-sel" onchange="setLessonStatus('${l.id}',this.value)">
        ${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===l.status?'selected':''}>${STATUS[k].label}</option>`).join('')}
      </select>
      <button class="icon-btn" title="Додати в Apple Календар" onclick="exportLessonICS('${l.id}')">📆</button>
      <button class="icon-btn" title="Редагувати" onclick="lessonModal('${l.id}')">✎</button>
      <button class="icon-btn danger" title="Видалити" onclick="deleteLesson('${l.id}')">✕</button>
    </div>
  </div>`;
}
function setLessonStatus(id,val){const l=db.lessons.find(x=>x.id===id);if(!l)return;l.status=val;save();drawMonth();renderDayPanel();}
function deleteLesson(id){if(!confirm('Видалити цей урок?'))return;db.lessons=db.lessons.filter(x=>x.id!==id);save();drawMonth();renderDayPanel();}

function weekTotals(dayISO){
  const mon=mondayOf(parseISO(dayISO));const sun=addDays(mon,6);
  const from=iso(mon),to=iso(sun);
  const ls=db.lessons.filter(l=>l.date>=from&&l.date<=to&&scheduled(l.status));
  const hours=ls.reduce((a,l)=>a+(Number(l.dur)||0),0);
  const value=ls.reduce((a,l)=>a+lessonCost(l),0);
  return {hours,value,count:ls.length,label:`${mon.getDate()} ${MONTHS[mon.getMonth()].slice(0,3)} – ${sun.getDate()} ${MONTHS[sun.getMonth()].slice(0,3)}`};
}

/* ---- lesson modal ---- */
function lessonModal(id,presetDate){
  const l=id?db.lessons.find(x=>x.id===id):null;
  if(!db.students.length){
    openModal('Спочатку додайте учня','<p style="color:var(--muted)">Щоб планувати уроки, спершу створіть хоча б одного учня у вкладці «Учні».</p>',
      [{label:'До учнів',primary:true,onClick:()=>{closeModal();go('students');}}]);
    return;
  }
  const opts=db.students.filter(s=>s.active!==false).map(s=>`<option value="${s.id}" ${l&&l.studentId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const body=`
    <div class="field"><label>Учень</label><select id="l_stu">${opts}</select></div>
    <div class="field-row">
      <div class="field"><label>Дата</label><input type="date" id="l_date" value="${l?l.date:(presetDate||todayISO())}"></div>
      <div class="field"><label>Час</label><input type="time" id="l_time" value="${l?l.time:'17:00'}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Тривалість (год)</label><input type="number" id="l_dur" step="0.25" min="0.25" value="${l?l.dur:1}"></div>
      <div class="field"><label>Статус</label><select id="l_status">${Object.keys(STATUS).map(k=>`<option value="${k}" ${l&&l.status===k?'selected':(!l&&k==='planned'?'selected':'')}>${STATUS[k].label}</option>`).join('')}</select></div>
    </div>
    ${!l?`<div class="field"><label>Повторювати щотижня</label><select id="l_rep">
      <option value="1">Один раз</option><option value="4">4 тижні</option><option value="8">8 тижнів</option><option value="12">12 тижнів</option><option value="16">16 тижнів</option>
    </select></div>`:''}
    <div class="field"><label>Нотатка (необовʼязково)</label><input id="l_note" value="${l?esc(l.note||''):''}" placeholder="напр.: Unit 5, тема Present Perfect"></div>`;
  openModal(l?'Редагувати урок':'Новий урок',body,[
    {label:'Скасувати',onClick:closeModal},
    {label:l?'Зберегти':'Додати',primary:true,onClick:()=>saveLesson(id)}
  ]);
}
function saveLesson(id){
  const studentId=val('l_stu'),date=val('l_date'),time=val('l_time'),dur=Number(val('l_dur'))||1,status=val('l_status'),note=val('l_note').trim();
  if(!date){toast('Вкажіть дату');return;}
  if(id){const l=db.lessons.find(x=>x.id===id);Object.assign(l,{studentId,date,time,dur,status,note});}
  else{
    const rep=Number(val('l_rep'))||1;let d=parseISO(date);
    for(let i=0;i<rep;i++){db.lessons.push({id:uid(),studentId,date:iso(d),time,dur,status,note});d=addDays(d,7);}
    selDay=date;
  }
  save();closeModal();
  const n=parseISO(date);calY=n.getFullYear();calM=n.getMonth();
  renderCalendar(document.getElementById('screen'));
  toast(id?'Урок оновлено':'Урок додано');
}

/* ======================= STUDENTS ======================= */
function renderStudents(root){
  const list=db.students;
  const owe=list.filter(s=>studentBalance(s.id)< -0.5);
  root.innerHTML=`
    <div class="page-head">
      <div><h1>Учні</h1><p>${list.length} ${plz(list.length,'учень','учні','учнів')}${owe.length?` · <span class="money-neg">${owe.length} із боргом</span>`:''}</p></div>
      <button class="btn primary" onclick="studentModal()">＋ Додати учня</button>
    </div>
    ${list.length? `<div class="card">${list.map(studentRowHTML).join('')}</div>` :
      `<div class="empty"><span class="big">👥</span>Ще немає учнів.<br><br><button class="btn primary small" onclick="studentModal()">＋ Додати першого учня</button></div>`}`;
}
function studentRowHTML(s){
  const tg=tagOf(s.tagId);const bal=studentBalance(s.id);const rate=rateOf(s);
  const done=db.lessons.filter(l=>l.studentId===s.id&&l.status==='done').length;
  const balCls=bal>0.5?'money-pos':bal<-0.5?'money-neg':'money-zero';
  const balTxt=bal>0.5?`+${money(bal)} наперед`:bal<-0.5?`борг ${money(-bal)}`:'сплачено';
  const prepaid=rate>0&&bal>0.5?` · ≈${Math.floor(bal/rate)} ${plz(Math.floor(bal/rate),'заняття','заняття','занять')}`:'';
  return `<div class="list-row stu-row">
    <div>
      <div class="stu-name"><span class="tag-dot" style="background:${tg.color}"></span>${esc(s.name)}${s.active===false?' <span class="badge" style="background:#0000000d;color:var(--muted)">неактивний</span>':''}</div>
      <div class="stu-meta">${esc(tg.name)} · ${money(rate)}/год · ${esc(payLabel(s.payType))} · проведено ${done}</div>
    </div>
    <div class="${balCls}" style="text-align:right;font-size:.88rem">${balTxt}${prepaid}</div>
    <button class="btn small" onclick="paymentModal('${s.id}')">₴ Оплата</button>
    <button class="icon-btn" onclick="studentModal('${s.id}')" title="Редагувати">✎</button>
  </div>`;
}
function payLabel(t){return ({hourly:'погодинно',package:'пакет занять',sub_week:'абонемент (тиждень)',sub_month:'абонемент (місяць)'})[t]||'погодинно';}

function studentModal(id){
  const s=id?studentOf(id):null;
  const tagOpts=db.tags.map(t=>`<option value="${t.id}" ${s&&s.tagId===t.id?'selected':''}>${esc(t.name)} (${money(t.rate)}/год)</option>`).join('');
  const payOpts=[['hourly','Погодинно'],['package','Пакет занять'],['sub_week','Абонемент (тиждень)'],['sub_month','Абонемент (місяць)']]
    .map(([v,t])=>`<option value="${v}" ${s&&s.payType===v?'selected':''}>${t}</option>`).join('');
  const body=`
    <div class="field"><label>Імʼя</label><input id="s_name" value="${s?esc(s.name):''}" placeholder="напр.: Марія К."></div>
    <div class="field-row">
      <div class="field"><label>Група (тег)</label><select id="s_tag">${tagOpts}</select></div>
      <div class="field"><label>Своя ціна/год</label><input id="s_rate" type="number" min="0" value="${s&&s.rate!=null&&s.rate!==''?s.rate:''}" placeholder="за тегом"></div>
    </div>
    <div class="field"><label>Спосіб оплати</label><select id="s_pay">${payOpts}</select></div>
    <div class="field"><label>Контакт / нотатка</label><input id="s_note" value="${s?esc(s.note||''):''}" placeholder="телефон, Telegram, тощо"></div>
    ${s?`<div class="field"><label>Статус</label><select id="s_active"><option value="1" ${s.active!==false?'selected':''}>Активний</option><option value="0" ${s.active===false?'selected':''}>Неактивний (пауза)</option></select></div>`:''}`;
  const actions=[{label:'Скасувати',onClick:closeModal}];
  if(s)actions.push({label:'Видалити',danger:true,left:true,onClick:()=>deleteStudent(id)});
  actions.push({label:s?'Зберегти':'Додати',primary:true,onClick:()=>saveStudent(id)});
  openModal(s?'Редагувати учня':'Новий учень',body,actions);
}
function saveStudent(id){
  const name=val('s_name').trim();if(!name){toast('Вкажіть імʼя');return;}
  const data={name,tagId:val('s_tag'),rate:val('s_rate').trim(),payType:val('s_pay'),note:val('s_note').trim()};
  if(id){const s=studentOf(id);Object.assign(s,data,{active:val('s_active')==='1'});}
  else db.students.push({id:uid(),active:true,...data});
  save();closeModal();renderStudents(document.getElementById('screen'));toast(id?'Збережено':'Учня додано');
}
function deleteStudent(id){
  const cnt=db.lessons.filter(l=>l.studentId===id).length;
  if(!confirm(`Видалити учня разом із його уроками (${cnt}) та оплатами? Цю дію не можна скасувати.`))return;
  db.students=db.students.filter(s=>s.id!==id);
  db.lessons=db.lessons.filter(l=>l.studentId!==id);
  db.payments=db.payments.filter(p=>p.studentId!==id);
  save();closeModal();renderStudents(document.getElementById('screen'));
}

/* ======================= PAYMENTS ======================= */
function renderPayments(root){
  const owe=db.students.filter(s=>studentBalance(s.id)< -0.5).sort((a,b)=>studentBalance(a.id)-studentBalance(b.id));
  const prepaid=db.students.filter(s=>studentBalance(s.id)>0.5);
  const totalOwed=owe.reduce((a,s)=>a-studentBalance(s.id),0);
  const totalPrepaid=prepaid.reduce((a,s)=>a+studentBalance(s.id),0);
  const recent=[...db.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,30);
  root.innerHTML=`
    <div class="page-head">
      <div><h1>Оплати</h1><p>Хто сплатив, хто винен, історія платежів</p></div>
      <button class="btn primary" onclick="paymentModal()">＋ Записати оплату</button>
    </div>
    <div class="stat-row">
      <div class="stat brick"><div class="lbl">Треба отримати</div><div class="val">${money(totalOwed)}</div><div class="sub">${owe.length} ${plz(owe.length,'учень','учні','учнів')} з боргом</div></div>
      <div class="stat"><div class="lbl">Сплачено наперед</div><div class="val">${money(totalPrepaid)}</div><div class="sub">${prepaid.length} ${plz(prepaid.length,'учень','учні','учнів')}</div></div>
    </div>
    <div class="section-title">Треба сплатити</div>
    ${owe.length? `<div class="card">${owe.map(s=>oweRow(s,true)).join('')}</div>` : `<div class="empty" style="padding:26px">Боржників немає 🎉</div>`}
    <div class="section-title">Сплачено наперед / абонемент</div>
    ${prepaid.length? `<div class="card">${prepaid.map(s=>oweRow(s,false)).join('')}</div>` : `<div class="empty" style="padding:26px">Поки нікого</div>`}
    <div class="section-title">Останні платежі</div>
    ${recent.length? `<div class="card">${recent.map(payRowHTML).join('')}</div>` : `<div class="empty" style="padding:26px">Ще не було платежів</div>`}`;
}
function oweRow(s,isOwe){
  const bal=studentBalance(s.id);const rate=rateOf(s);
  const info=isOwe?`борг ${money(-bal)}`:`+${money(bal)}${rate>0?` · ≈${Math.floor(bal/rate)} ${plz(Math.floor(bal/rate),'заняття','заняття','занять')}`:''}`;
  return `<div class="list-row stu-row">
    <div><div class="stu-name"><span class="tag-dot" style="background:${tagOf(s.tagId).color}"></span>${esc(s.name)}</div>
      <div class="stu-meta">${esc(payLabel(s.payType))} · ${money(rate)}/год</div></div>
    <div class="${isOwe?'money-neg':'money-pos'}" style="text-align:right;font-size:.88rem">${info}</div>
    <button class="btn small ${isOwe?'primary':''}" onclick="paymentModal('${s.id}')">₴ Оплата</button>
    <span></span>
  </div>`;
}
function payRowHTML(p){
  const s=studentOf(p.studentId);
  return `<div class="list-row pay-row">
    <div><div class="stu-name">${esc(s?s.name:'—')}</div><div class="stu-meta">${fmtDate(p.date)} · ${esc(payKindLabel(p.kind))}${p.note?' · '+esc(p.note):''}</div></div>
    <div class="money-pos" style="text-align:right">${money(p.amount)}</div>
    <button class="icon-btn danger hide-sm" title="Видалити" onclick="deletePayment('${p.id}')">✕</button>
  </div>`;
}
function payKindLabel(k){return ({once:'разова оплата',package:'пакет занять',sub_week:'абонемент (тиждень)',sub_month:'абонемент (місяць)'})[k]||'оплата';}
function deletePayment(id){if(!confirm('Видалити цей платіж?'))return;db.payments=db.payments.filter(p=>p.id!==id);save();renderPayments(document.getElementById('screen'));}

function paymentModal(studentId){
  if(!db.students.length){toast('Спочатку додайте учня');go('students');return;}
  const opts=db.students.map(s=>`<option value="${s.id}" ${studentId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');
  const kindOpts=[['once','Разова оплата'],['package','Пакет занять'],['sub_week','Абонемент (тиждень)'],['sub_month','Абонемент (місяць)']]
    .map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
  const body=`
    <div class="field"><label>Учень</label><select id="p_stu">${opts}</select></div>
    <div class="field-row">
      <div class="field"><label>Сума (${CUR()})</label><input id="p_amount" type="number" min="0" placeholder="напр.: 2400"></div>
      <div class="field"><label>Дата</label><input id="p_date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="field"><label>Тип</label><select id="p_kind">${kindOpts}</select></div>
    <div class="field"><label>Нотатка (необовʼязково)</label><input id="p_note" placeholder="напр.: 8 занять до кінця місяця"></div>
    <div class="hint" style="margin:0">💡 Сума додається до балансу учня. Баланс = сплачено − вартість проведених уроків.</div>`;

    {label:'Скасувати',onClick:closeModal},
    {label:'Записати',primary:true,onClick:savePayment}
  ]);
}
function savePayment(){
  const amount=Number(val('p_amount'));
  if(!amount||amount<=0){toast('Вкажіть суму');return;}
  db.payments.push({id:uid(),studentId:val('p_stu'),amount,date:val('p_date')||todayISO(),kind:val('p_kind'),note:val('p_note').trim()});

  if(tab==='payments')renderPayments(document.getElementById('screen'));else if(tab==='students')renderStudents(document.getElementById('screen'));

/* ======================= STATS ======================= */
let statRange='week';
function renderStats(root){
  const now=new Date();
  let from,to,title;
  if(statRange==='week'){const m=mondayOf(now);from=iso(m);to=iso(addDays(m,6));title='Цей тиждень';}
  else{from=iso(new Date(now.getFullYear(),now.getMonth(),1));to=iso(new Date(now.getFullYear(),now.getMonth()+1,0));title=MONTHS_N[now.getMonth()];}

  const inRange=l=>l.date>=from&&l.date<=to;
  const sched=db.lessons.filter(l=>inRange(l)&&scheduled(l.status));
  const done=db.lessons.filter(l=>inRange(l)&&l.status==='done');
  const schedHours=sched.reduce((a,l)=>a+(Number(l.dur)||0),0);
  const doneHours=done.reduce((a,l)=>a+(Number(l.dur)||0),0);
  const schedValue=sched.reduce((a,l)=>a+lessonCost(l),0);
  const doneValue=db.lessons.filter(l=>inRange(l)&&billable(l.status)).reduce((a,l)=>a+lessonCost(l),0);

  const wk=weekTotals(todayISO());
  const monthProj=wk.value*4.33;

  const byTag=db.tags.map(t=>{
    const ls=sched.filter(l=>{const s=studentOf(l.studentId);return s&&s.tagId===t.id;});
    return {tag:t,hours:ls.reduce((a,l)=>a+(Number(l.dur)||0),0),value:ls.reduce((a,l)=>a+lessonCost(l),0),count:ls.length};
  }).filter(x=>x.count>0);

  const totalOwed=db.students.reduce((a,s)=>{const b=studentBalance(s.id);return a+(b<-0.5?-b:0);},0);

  root.innerHTML=`
    <div class="page-head">
      <div><h1>Підрахунки</h1><p>Години та вартість занять</p></div>
      <div style="display:flex;gap:6px">
        <button class="btn small ${statRange==='week'?'primary':''}" onclick="setRange('week')">Тиждень</button>
        <button class="btn small ${statRange==='month'?'primary':''}" onclick="setRange('month')">Місяць</button>
      </div>
    </div>
    <div class="section-title" style="margin-top:0">${title}</div>
    <div class="stat-row">
      <div class="stat"><div class="lbl">Годин за розкладом</div><div class="val">${fmtHours(schedHours)}</div><div class="sub">${sched.length} ${plz(sched.length,'урок','уроки','уроків')}</div></div>
      <div class="stat"><div class="lbl">Проведено годин</div><div class="val">${fmtHours(doneHours)}</div><div class="sub">${done.length} ${plz(done.length,'урок','уроки','уроків')}</div></div>
      <div class="stat amber"><div class="lbl">Вартість (розклад)</div><div class="val">${money(schedValue)}</div><div class="sub">заплановано</div></div>
      <div class="stat"><div class="lbl">Зароблено (проведено)</div><div class="val">${money(doneValue)}</div><div class="sub">білінг</div></div>
    </div>
    <div class="stat-row">
      <div class="stat slate"><div class="lbl">Прогноз на місяць</div><div class="val">${money(monthProj)}</div><div class="sub">≈ тиждень × 4.33</div></div>
      <div class="stat brick"><div class="lbl">Заборгованість учнів</div><div class="val">${money(totalOwed)}</div><div class="sub">разом до отримання</div></div>
    </div>
    <div class="section-title">За групами (${title.toLowerCase()})</div>
    ${byTag.length? `<div class="card">${byTag.map(x=>`
      <div class="list-row" style="grid-template-columns:1fr auto auto">
        <div class="stu-name"><span class="tag-dot" style="background:${x.tag.color}"></span>${esc(x.tag.name)}</div>
        <div class="stu-meta">${fmtHours(x.hours)} год · ${x.count} ${plz(x.count,'урок','уроки','уроків')}</div>
        <div style="font-weight:700;text-align:right">${money(x.value)}</div>
      </div>`).join('')}</div>` : `<div class="empty" style="padding:26px">У цьому періоді уроків немає</div>`}`;
}
function setRange(r){statRange=r;renderStats(document.getElementById('screen'));}

/* ======================= SETTINGS ======================= */
function renderSettings(root){
  root.innerHTML=`
    <div class="page-head"><div><h1>Налаштування</h1><p>Групи, ціни та резервні копії</p></div></div>

    <div class="set-block">
      <h3>Групи учнів і ціни</h3>
      <p class="d">Теги для групування (мої / від школи / заміна) і ціна за годину за замовчуванням для кожної групи. В окремого учня можна задати свою ціну.</p>
      <div id="tagEditor"></div>
      <button class="btn small" onclick="addTag()">＋ Додати групу</button>
    </div>

    <div class="set-block">
      <h3>Валюта</h3>
      <p class="d">Символ валюти для всіх сум.</p>
      <div style="max-width:160px"><input id="curInput" style="display:block;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)" value="${esc(CUR())}" onchange="setCurrency(this.value)"></div>
    </div>

    <div class="set-block">
      <h3>Резервні копії</h3>
      <p class="d">Дані зберігаються в цьому браузері. Робіть копію час від часу — щоб не втратити при чищенні браузера чи переході на інший пристрій.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary small" onclick="exportBackup()">⤓ Зберегти копію</button>
        <button class="btn small" onclick="document.getElementById('importFile').click()">⤒ Відновити з копії</button>
      </div>
    </div>

    <div class="set-block" style="border-color:#e9cfc7">
      <h3 style="color:var(--brick)">Очистити все</h3>
      <p class="d">Видалить усіх учнів, уроки й оплати без можливості відновлення. Спершу зробіть копію.</p>
      <button class="btn small danger" onclick="wipeAll()">Очистити всі дані</button>
    </div>`;
  drawTagEditor();
}
function drawTagEditor(){
  const box=document.getElementById('tagEditor');if(!box)return;
  box.innerHTML=db.tags.map(t=>`
    <div class="tag-edit">
      <input type="color" value="${t.color}" style="width:32px;height:32px;padding:0;border:none;background:none;cursor:pointer" onchange="updTag('${t.id}','color',this.value)">
      <input value="${esc(t.name)}" onchange="updTag('${t.id}','name',this.value)" placeholder="Назва групи">
      <input type="number" min="0" value="${t.rate}" onchange="updTag('${t.id}','rate',this.value)" placeholder="₴/год">
      <button class="icon-btn danger" onclick="delTag('${t.id}')" title="Видалити групу">✕</button>
    </div>`).join('');
}
function updTag(id,f,v){const t=db.tags.find(x=>x.id===id);if(!t)return;t[f]=f==='rate'?Number(v)||0:v;save();}
function addTag(){db.tags.push({id:uid(),name:'Нова група',color:'#7C776C',rate:0});save();drawTagEditor();}
function delTag(id){
  const used=db.students.filter(s=>s.tagId===id).length;
  if(used){toast(`Групу використовують ${used} учнів — спершу змініть їх`);return;}
  if(db.tags.length<=1){toast('Має лишитися хоча б одна група');return;}
  if(!confirm('Видалити цю групу?'))return;
  db.tags=db.tags.filter(t=>t.id!==id);save();drawTagEditor();
}
function setCurrency(v){db.settings.currency=v.trim()||'₴';save();toast('Валюту змінено');}
function wipeAll(){
  if(!confirm('Видалити ВСІ дані (учнів, уроки, оплати)? Відновити не вийде.'))return;
  if(!confirm('Точно? Радимо спершу зберегти копію.'))return;
  db=defaultData();save();go('calendar');toast('Дані очищено');
}

/* ======================= Apple Calendar (.ics) ======================= */
function pad(n){return String(n).padStart(2,'0');}
function icsDT(dateISO,timeHM){const[y,m,d]=dateISO.split('-').map(Number);const[H,M]=(timeHM||'00:00').split(':').map(Number);
  return `${y}${pad(m)}${pad(d)}T${pad(H)}${pad(M)}00`;}
function icsDTend(dateISO,timeHM,durH){const[y,m,d]=dateISO.split('-').map(Number);const[H,M]=(timeHM||'00:00').split(':').map(Number);
  const dt=new Date(y,m-1,d,H,M);dt.setMinutes(dt.getMinutes()+Math.round(durH*60));
  return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function stampUTC(){const d=new Date();return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;}
function vevent(l){
  const stu=studentOf(l.studentId);const tg=tagOf(stu?stu.tagId:0);
  const sum=`Урок — ${stu?stu.name:'учень'}`;
  const desc=`Група: ${tg.name}. Тривалість: ${fmtHours(l.dur)} год.${l.note?' '+l.note:''}`;
  return ['BEGIN:VEVENT',`UID:${l.id}@zhurnal`,`DTSTAMP:${stampUTC()}`,
    `DTSTART:${icsDT(l.date,l.time)}`,`DTEND:${icsDTend(l.date,l.time,Number(l.dur)||1)}`,
    `SUMMARY:${icsEsc(sum)}`,`DESCRIPTION:${icsEsc(desc)}`,'END:VEVENT'].join('\r\n');
}
function downloadICS(events,filename){
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zhurnal//UK','CALSCALE:GREGORIAN',...events,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}
function exportLessonICS(id){const l=db.lessons.find(x=>x.id===id);if(!l)return;downloadICS([vevent(l)],'urok.ics');toast('Відкрийте файл, щоб додати в Календар');}
function exportWeekICS(dayISO){
  const mon=mondayOf(parseISO(dayISO));const from=iso(mon),to=iso(addDays(mon,6));
  const ls=db.lessons.filter(l=>l.date>=from&&l.date<=to&&l.status!=='cancelled_free'&&l.status!=='moved');
  if(!ls.length){toast('На цей тиждень немає уроків');return;}
  downloadICS(ls.map(vevent),'tyzhden.ics');toast(`${ls.length} ${plz(ls.length,'урок','уроки','уроків')} → відкрийте файл`);
}

/* ======================= backup ======================= */
function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='zhurnal-kopiya-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);
  toast('Копію збережено');
}
function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.students)||!Array.isArray(d.lessons))throw 0;
      if(!confirm('Замінити поточні дані даними з копії? Поточні буде втрачено (зробіть копію, якщо треба).'))return;
      db={settings:d.settings||{currency:'₴'},tags:d.tags||[],students:d.students||[],lessons:d.lessons||[],payments:d.payments||[]};
      save();go('calendar');toast('Дані відновлено');
    }catch(err){alert('Не вдалося прочитати файл. Оберіть файл, збережений через «Зберегти копію».');}
    e.target.value='';
  };
  r.readAsText(f);
}

/* ======================= modal framework ======================= */
function openModal(title,bodyHTML,actions){
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3>${esc(title)}</h3>${bodyHTML}<div class="modal-actions" id="mActions"></div>`;
  const bar=box.querySelector('#mActions');
  (actions||[]).forEach(a=>{
    const b=document.createElement('button');
    b.className='btn small'+(a.primary?' primary':'')+(a.danger?' danger':'')+(a.left?' left':'');
    b.textContent=a.label;b.onclick=a.onClick;bar.appendChild(b);
  });
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
function val(id){const el=document.getElementById(id);return el?el.value:'';}
</script>
